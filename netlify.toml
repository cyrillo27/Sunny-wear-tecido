# Site e servidor juntos na Netlify. O banco de dados fica no Neon.
# Configure DATABASE_URL e SENHA_ACOES em: Site configuration > Environment variables.
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# As chamadas do site para /api/... vão para a função do servidor
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
